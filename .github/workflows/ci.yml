name: Check Gatsby

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: npm ci
      - run: npm test
      - run: npm run check-books
      - run: npm run check-public
      - run: npm run check-contrast
      - run: npm run build
      - run: python -m unittest discover -s tests -p "test_*.py"
